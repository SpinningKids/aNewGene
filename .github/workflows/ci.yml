name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSVC, debug + release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Materialize LFS blobs
        shell: pwsh
        run: |
          git lfs install
          git lfs pull
          $ico = Get-Item Resources/windows/SK.ICO
          if ($ico.Length -lt 200) { throw "SK.ICO is only $($ico.Length) bytes (looks like an LFS pointer)" }
      - name: Configure + build (debug)
        shell: pwsh
        run: |
          $root = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $root) { throw "Visual Studio with C++ tools not found" }
          $vcvars = Join-Path $root "VC\Auxiliary\Build\vcvarsall.bat"
          foreach ($line in (cmd /c "call `"$vcvars`" x64 && set")) {
              if ($line -match "^([^=]+)=(.*)$") { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process') }
          }
          cmake --preset x64-debug
          cmake --build out/build/x64-debug --parallel
      - name: Configure + build (release)
        shell: pwsh
        run: |
          $root = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $root) { throw "Visual Studio with C++ tools not found" }
          $vcvars = Join-Path $root "VC\Auxiliary\Build\vcvarsall.bat"
          foreach ($line in (cmd /c "call `"$vcvars`" x64 && set")) {
              if ($line -match "^([^=]+)=(.*)$") { [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process') }
          }
          cmake --preset x64-release
          cmake --build out/build/x64-release --parallel
      - name: Stage demo executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows | Out-Null
          Copy-Item out\build\x64-release\aNewGene.exe windows\aNewGene.exe
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows

  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libsdl2-dev
      - name: Configure
        run: cmake --preset linux-debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build out/build/linux-debug --parallel
      - name: Stage demo executable
        run: |
          set -euo pipefail
          mkdir -p linux
          cp out/build/linux-debug/aNewGene linux/aNewGene
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: linux

  mingw:
    name: MinGW (x64, debug + release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Materialize LFS blobs
        run: |
          git lfs install
          git lfs pull
          size=$(stat -c%s Resources/windows/SK.ICO)
          if [ "$size" -lt 200 ]; then echo "SK.ICO is only $size bytes (looks like an LFS pointer)" >&2; exit 1; fi
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - name: Configure + build (debug)
        run: |
          cmake -B out/build/mingw-debug -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build out/build/mingw-debug --parallel
      - name: Configure + build (release)
        run: |
          cmake -B out/build/mingw-release -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build out/build/mingw-release --parallel
      - name: Stage demo executable
        run: |
          set -euo pipefail
          mkdir -p mingw
          cp out/build/mingw-release/aNewGene.exe mingw/aNewGene.exe
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: mingw
          path: mingw

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libsdl2-dev
      - name: Configure
        run: cmake --preset linux-debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy
        run: >
          clang-tidy -p out/build/linux-debug -quiet
          src/GenTex.cpp src/GLTexture.cpp src/Main.cpp src/MATH3.CPP
          src/Particles.cpp src/noise.cpp src/utils.cpp

  release:
    name: Release (zip + GitHub release)
    needs: [windows, linux, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
      - name: Create release zip
        run: |
          set -euo pipefail
          mv windows/aNewGene.exe .
          mv linux/aNewGene .
          rm -rf windows linux
          python3 -m zipfile -c sk-ng2026.zip README.md aNewGene aNewGene.exe
          python3 -m zipfile -l sk-ng2026.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(date -u +%Y.%m.%d)"
          ZIP="sk-ng2026.zip"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release create "${TAG}" --title "aNewGene — post-pandemic edition" --notes-file README.md --repo "${GITHUB_REPOSITORY}"
          fi
          HAS_ASSET="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq ".assets | any(.name == \"${ZIP}\")")"
          if [ "${HAS_ASSET}" = "true" ]; then
              # a second push on the same day: GitHub rejects a duplicate asset
              # name (422). Keep the zip already published for that day.
              echo "Release ${TAG} already has ${ZIP}: keeping the existing asset, skipping upload"
          else
              # gh expands the upload_url URI template, handles auth and content
              # length correctly — the hand-rolled curl upload always 400'd.
              gh release upload "${TAG}" "${ZIP}" --repo "${GITHUB_REPOSITORY}"
              echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi
